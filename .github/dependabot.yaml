version: 2
updates:
  # Go modules (go.mod / go.sum)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  # Base images in the Dockerfile (golang, distroless)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Action versions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]